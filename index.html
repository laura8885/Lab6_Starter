<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Lab 6 - Recipe Cards</title>

	<script src="assets/scripts/RecipeCard.js" type="module"></script>
	<link rel="stylesheet" href="assets/styles/main.css" />
	<script src="assets/scripts/main.js" type="module"></script>
</head>

<body>
	<main>
	</main>

	<form id="new-recipe">
		<fieldset>
			<legend>Image:</legend>
			<label for="imgSrc">
				Source:
				<input type="text" id="imgSrc" name="imgSrc" required />
			</label>
			<label for="imgAlt">
				Alt Text:
				<input type="text" id="imgAlt" name="imgAlt" required />
			</label>
		</fieldset>

		<fieldset>
			<legend>Title:</legend>
			<label for="titleTxt">
				Text:
				<input type="text" id="titleTxt" name="titleTxt" required />
			</label>
			<label for="titleLnk">
				Link:
				<input type="url" id="titleLnk" name="titleLnk" required />
			</label>
		</fieldset>

		<fieldset>
			<legend>Rating</legend>
			<label><input type="radio" value="0" name="rating" /> 0</label>
			<label><input type="radio" value="1" name="rating" /> 1</label>
			<label><input type="radio" value="2" name="rating" /> 2</label>
			<label><input type="radio" value="3" name="rating" /> 3</label>
			<label><input type="radio" value="4" name="rating" /> 4</label>
			<label><input type="radio" value="5" name="rating" /> 5</label>

			<label for="numRatings">
				Num Ratings:
				<input type="number" id="numRatings" name="numRatings" />
			</label>
		</fieldset>

		<fieldset>
			<legend>Other Info:</legend>
			<label for="organization">
				Organization:
				<input type="text" id="organization" name="organization" required />
			</label>

			<label for="lengthTime">
				Length (time):
				<input type="text" id="lengthTime" name="lengthTime" required />
			</label>

			<label for="ingredients">
				<p>Ingredients:</p>
				<textarea name="ingredients" id="ingredients" cols="38" rows="5" required></textarea>
			</label>
		</fieldset>

		<button type="submit">Add Recipe</button>
		<button type="button" class="danger">Clear Local Storage</button>
	</form>
</body>

</html>
